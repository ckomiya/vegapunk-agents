name: validate-core

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/validate-core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/validate-core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install -r core/tools/requirements.txt
      - name: Validate core
        run: python core/tools/validate_core.py
