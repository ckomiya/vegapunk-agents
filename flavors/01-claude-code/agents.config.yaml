#
# Per-satellite Claude Code subagent settings (stella is the human; no entry).
# These are DEFAULT values meant for testing. Change them to suit your needs,
# then regenerate with: python flavors/01-claude-code/tools/generate_agents.py
#
# The engine is the main-session /vegapunk skill. It does mechanical work
# (relay script output, call satellites), so a low effort is enough.
# Valid values: low, medium, high, xhigh, max. Raise it only if a test justifies it.
engine:
  effort: low
satellites:
  punk-01-shaka:
    model: sonnet
    color: blue
    maxTurns: 5
    tools: [Read, Grep, Glob]
  punk-02-lilith:
    model: sonnet
    color: red
    maxTurns: 5
    tools: [Read, Grep, Glob]
  punk-03-edison:
    model: sonnet
    color: yellow
    maxTurns: 5
    tools: [Read, Grep, Glob]
  punk-04-pythagoras:
    model: sonnet
    color: cyan
    maxTurns: 12  # room for the per-mission search limit plus page fetches
    tools: [WebSearch, WebFetch, Read, Grep, Glob]
  punk-05-atlas:
    model: haiku
    color: orange
    maxTurns: 30
    tools: [Read, Write, Edit, Bash, Grep, Glob]
  punk-06-york:
    model: haiku
    color: purple
    maxTurns: 15
    tools: [Read, Edit, Grep, Glob]
